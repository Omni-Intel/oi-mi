subject_id: S001
model_name: cbramod
device_type: neuracle
hardware_dummy_mode: false
sfreq: 200
n_classes: 3
window_sec: 2.0
step_sec: 0.5
confidence_threshold: 0.5
mc_dropout_passes: 8
calibration_epochs: 50
batch_size: 32
learning_rate: 0.001
collect_block_sec: 10
buffer_sec: 60
protocol:
  control_start_offset_sec: 0.5
  control_stop_offset_sec: 4.5
  export_window_sec: 1.5
  export_stride_sec: 0.5
  practice_labels:
  - left
  - right
  - idle
  - left
  - right
  - idle
  practice_repetitions: 1
  baseline_segments:
  - name: eyes_open_fixation
    duration_sec: 60.0
    instruction: 睁眼注视中央十字，保持放松。
  trial_timing:
    fixation_sec: 2.0
    cue_sec: 1.0
    control_sec: 5.0
    iti_sec: 2.0
  calibration_blocks: 4
  calibration_trials_per_class_per_block: 5
  # Complete at least the original 60 balanced trials, then continue until the
  # operator requests completion. Pause and completion take effect at trial
  # boundaries so partial trials never enter the training set.
  continuous_collection: true
  minimum_calibration_trials: 60
  rest_between_blocks_sec: 20.0
  random_seed: 17
device:
  neuracle_host: 127.0.0.1
  neuracle_port: 8712
  # Neuracle/JellyFish hardware forwards at 250 Hz. Retained continuous EEG is
  # preprocessed/resampled to 200 Hz before model windows are cut.
  neuracle_source_sfreq: 250
  # Optional fixed-delay compensation from amplifier sample time to JellyFish.
  # Keep this at 0.0 when no independent measurement is available.
  neuracle_transport_delay_sec: 0.0
  neuracle_eeg_channels: 59
  # Verified from the native 64-channel BDF files recorded on 2026-07-25 and
  # 2026-07-27. The five excluded channels are ECG/HEOR/HEOL/VEOU/VEOL.
  # JellyFish is matched by name at startup; missing or duplicate channels stop
  # the formal run instead of silently changing the model input montage.
  neuracle_eeg_channel_names:
  - Fpz
  - Fp1
  - Fp2
  - AF3
  - AF4
  - AF7
  - AF8
  - Fz
  - F1
  - F2
  - F3
  - F4
  - F5
  - F6
  - F7
  - F8
  - FCz
  - FC1
  - FC2
  - FC3
  - FC4
  - FC5
  - FC6
  - FT7
  - FT8
  - Cz
  - C1
  - C2
  - C3
  - C4
  - C5
  - C6
  - T7
  - T8
  - CP1
  - CP2
  - CP3
  - CP4
  - CP5
  - CP6
  - TP7
  - TP8
  - Pz
  - P3
  - P4
  - P5
  - P6
  - P7
  - P8
  - POz
  - PO3
  - PO4
  - PO5
  - PO6
  - PO7
  - PO8
  - Oz
  - O1
  - O2
  brainco_addr: ''
  brainco_port: 0
  # BrainCo hardware acquires at 250 Hz; retained continuous EEG is processed
  # and resampled to 200 Hz before model windows are cut.
  brainco_source_sfreq: 250
  brainco_auto_discover: true
  brainco_scan_timeout_sec: 6.0
  brainco_ready_timeout_sec: 20.0
  brainco_start_retries: 2
  brainco_gain: 6
  brainco_signal_source: NORMAL
  brainco_device_id: eeg-cap
  trigger_serial_port: ''
  dummy_label_aware: false
output:
  command_stream_name: oi_mi_commands
  command_stream_type: Markers
  ar_game:
    enabled: true
    host: 127.0.0.1
    port: 5005
    # Unity applies scene layouts on its main thread. Allow ordinary frame or
    # Windows scheduling stalls without falsely abandoning a valid scene.
    timeout_sec: 3.0
    # Optional delay compensation from Unity's scene ACK to obstacle visibility.
    # Keep this at 0.0 when no independent measurement is available.
    visual_onset_delay_sec: 0.0
    auto_launch: true
    executable_path: ../oi-car-unity-src/Car_game/Builds/Windows/ARPrototype3D.exe
    startup_timeout_sec: 15.0
    startup_command_delay_sec: 0.75
    startup_sequence:
    - command: OPEN_3D_GAME
      delay_after_sec: 2.0
    windowed: true
    window_width: 1280
    window_height: 720
    resizable_window: true
    close_on_stop: false
  web_control:
    enabled: true
    host: 0.0.0.0
    port: 8765
    manual_override_hold_sec: 0.8
    manual_override_release_sec: 0.25
storage:
  models_dir: models_storage
  records_dir: records_storage
  record_realtime_default: true
online_adaptation:
  enabled: true
  strategy: neuroonline
  update_interval_sec: 600
  train_scope: head
  learning_rate: 0.0001
  epochs: 3
  batch_size: 32
  min_total_windows: 180
  min_windows_per_class: 30
  validation_ratio: 0.2
  min_balanced_accuracy_gain: 0.02
  max_class_accuracy_drop: 0.05
  max_buffer_windows: 1800
  keep_previous_versions: 5
  random_seed: 17
  save_update_dataset: true
  neuroonline:
    # Selected by causal one-window-per-Scene replay on 2026-07-27. Freeze this
    # configuration before evaluating subsequent sessions.
    learning_rate: 1.0e-4
    update_batch_size: 8
    epochs: 3
    update_stride: 64
    # Start after 64 labeled windows, then update every 64 stream steps. The
    # replay buffer grows to 320 windows and remains capped at that size.
    history_threshold: 64
    recent_samples: 320
    weight_decay: 5.0e-2
    mask_ratio: 0.1
    consistency_weight: 1.5
    label_smoothing: 0.1
    prompt_count: 32
    # Online seed only controls stochastic masks and batch ordering during
    # realtime updates. Offline calibration uses an independent fixed seed.
    random_seed: 2026
    offline_random_seed: 42
    offline_epochs: 50
    offline_batch_size: 16
    # Best offline pretraining parameters selected from the 2026-07-27
    # calibration data (298 windows, 60 trial-grouped samples).
    offline_learning_rate: 1.0e-5
    offline_mask_ratio: 0.1
    offline_consistency_weight: 1.5
    calibration_search:
      # Freeze the validated 2026-07-27 result above. Do not let an older
      # mechanics-v0 report override it or block a formal calibration.
      enabled: false
      reuse_latest: false
      # Search every learning-rate/batch/mask/lambda combination. All candidates
      # share one trial-grouped split, while a separate set of complete trials
      # remains untouched until the winning configuration.
      mode: full_grid
      selection_epochs: 50
      learning_rates:
      - 1.0e-5
      - 3.0e-5
      - 1.0e-4
      - 3.0e-4
      - 1.0e-3
      batch_sizes:
      - 16
      - 32
      - 64
      - 128
      - 256
      mask_ratios:
      - 0.1
      - 0.3
      - 0.5
      - 0.7
      consistency_weights:
      - 0.1
      - 0.3
      - 0.5
      - 0.7
      - 1.0
      - 1.5
  simulation:
    enabled: false
    trial_sec: 6.0
    settle_sec: 2.0
  cued_labels:
    enabled: true
    # Unity holds one obstacle layout for this epoch. Forward motion and
    # decoding continue, but lateral commands are causally gated until the
    # clean current-Scene decision window has completed.
    # Every Scene resets the car to the center lane, so LEFT/RIGHT/IDLE remain
    # balanced and independent of the previous model output. The obstacle wall
    # remains visible and serves as the subject's action instruction.
    # A collision only records failure; the next scene still starts at the
    # fixed 5 s boundary.
    scene_duration_sec: 5.0
    # Collect 0.5-2.5 s, then release lateral control immediately. Each Scene
    # contributes exactly one sample to NeuroOnline and keeps about 2.5 s for
    # visible driving feedback in a 5 s Scene.
    primary_windows_per_scene: 1
    primary_window_spacing_sec: 1.0
    boundary_guard_sec: 0.5
    # Windows touching the 0.5 s before or after an actual completed lane
    # transition remain decoded and recorded, but receive no training label.
    lane_transition_guard_sec: 0.5
    balance_pool_per_class: 32
    start_delay_sec: 5.0
    # null generates and records an independent seed for every realtime session.
    random_seed: null
ssvep_game:
  rounds: 5
  keeper_save_probability: 0.35
  opponent_goal_probability: 0.7
  stability_windows: 2
  min_confidence: 0.35
